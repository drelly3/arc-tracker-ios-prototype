</head>
<body class="app">

<main>

<div class="arc-root">
  <div id="arc-gate" class="arc-gate" hidden>
    <form class="arc-gate-card" id="arc-gate-form" novalidate>
      <div class="arc-gate-icon" aria-hidden="true"><img src="/assets/kaminari-bolt.png" alt="" width="30" height="38"></div>
      <h1>Unlock Arc Tracker</h1>
      <p>Enter your access key.</p>
      <label for="arc-key">Licence key</label>
      <input type="text" id="arc-key" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX">
      <div class="arc-gate-msg" id="arc-gate-msg" role="alert"></div>
      <button type="submit" class="btn" id="arc-unlock">Unlock</button>
      <p class="arc-gate-foot">Arc Tracker is coming soon. Access is invite-only for now.</p>
      <div id="arc-preview-note" hidden>
        <button type="button" class="btn ghost" id="arc-preview-open" style="margin-top:14px;">Skip the key and open the tracker</button>
        <p class="arc-gate-foot">Preview only. This button and the sample key ARC7-K2MQ-9XTD-4HPL do not work on the live site.</p>
      </div>
      <p class="arc-gate-foot"><a href="/anime-mindset">← Back to Kaminari</a></p>
    </form>
  </div>
  <div id="arc-app" hidden>
    <header class="top">
      <div class="brand"><img class="kbolt" src="/assets/kaminari-bolt.png" alt="" width="12" height="16"><span class="word">ARC TRACKER</span></div>
      <div class="headline-badge" id="headerBadge">Set up your character in Setup →</div>
    </header>

    <div class="arc-main">
      <section class="tab active" id="tab-today"></section>
      <section class="tab" id="tab-progress"></section>
      <section class="tab" id="tab-archetypes"></section>
      <section class="tab" id="tab-setup"></section>
      <section class="tab" id="tab-guide"></section>
    </div>

    <nav class="tabs" aria-label="Arc Tracker">
      <button type="button" data-tab="today" class="active" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9"/></svg><span>Today</span></button>
      <button type="button" data-tab="progress"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span>Progress</span></button>
      <button type="button" data-tab="archetypes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg><span>Archetypes</span></button>
      <button type="button" data-tab="setup"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Setup</span></button>
      <button type="button" data-tab="guide"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h9.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h9.5"/></svg><span>Start Here</span></button>
    </nav>
    <noscript><p>Arc Tracker needs JavaScript turned on.</p></noscript>
  </div>
  <div id="modalRoot"></div>
</div>
<script src="/api-shim.js"></script>
<script src="/arc-gate.js" defer></script>
</main>

</body>
</html>
