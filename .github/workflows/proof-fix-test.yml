name: Proof-open fix check (simulator)
on:
  push:
    branches: [proof-fix-test]

# Only the sim-test job below may write (it pushes screenshots to a scratch branch).
permissions: {}

env:
  PROJECT_DIR: ios/App/App.xcodeproj
  SCHEME: App
  DERIVED: build/DerivedData

jobs:
  sim-test:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block production API egress for the test
        run: |
          set -e
          echo '127.0.0.1 animemindset.com' | sudo tee -a /etc/hosts
          echo '127.0.0.1 www.animemindset.com' | sudo tee -a /etc/hosts
          grep animemindset /etc/hosts
          if curl -sS -m 5 https://animemindset.com/api/arc-verify -o /dev/null 2>/tmp/curlerr; then
            echo 'ERROR: production API host still reachable'; exit 1
          else
            echo "production API host blocked as intended: $(cat /tmp/curlerr)"
          fi

      - name: Instrument network calls in the CI copy of the web files (evidence only)
        run: |
          cat >> www/api-shim.js <<'JSEOF'
          (()=>{const KEY='zz_netlog',f=window.fetch;
          function rd(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){return []}}
          function draw(){let d=document.getElementById('zznet');if(!d){if(!document.body)return;d=document.createElement('div');d.id='zznet';d.style.cssText='position:fixed;left:0;bottom:0;font-size:8px;opacity:.03;pointer-events:none;z-index:2147483647;max-width:100%;word-break:break-all';document.body.appendChild(d);}const a=rd();d.textContent='ZZNET '+a.length+' '+a.map(e=>e.k+' '+e.h+e.p+' '+e.m).map(x=>x.slice(0,90)).join(' ;; ').slice(0,900);}
          function rec(k,u,m){try{const x=new URL(String(u),location.href);const a=rd();a.push({k,h:x.host,p:x.pathname,m:m||'GET'});localStorage.setItem(KEY,JSON.stringify(a));draw();}catch(_){}}
          window.fetch=function(i,init){try{rec('fetch',typeof i==='string'?i:((i&&i.url)||''),(init&&init.method)||'GET')}catch(_){}return f.apply(this,arguments)};
          try{const xo=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){rec('xhr',u,m);return xo.apply(this,arguments)};}catch(_){}
          try{const sb=navigator.sendBeacon&&navigator.sendBeacon.bind(navigator);if(sb)navigator.sendBeacon=function(u){rec('beacon',u,'POST');return sb.apply(null,arguments)};}catch(_){}
          try{const W=window.WebSocket;window.WebSocket=function(u,pr){rec('ws',u,'WS');return pr?new W(u,pr):new W(u)};window.WebSocket.prototype=W.prototype;}catch(_){}
          try{const E=window.EventSource;if(E)window.EventSource=function(u,o){rec('sse',u,'GET');return new E(u,o)};}catch(_){}
          // positive control: proves the logger records a call made by page code in this build (same-origin, not external)
          setTimeout(()=>{try{window.fetch('/zz-positive-control').catch(()=>{})}catch(_){}},1500);
          document.addEventListener('DOMContentLoaded',draw);})();
          JSEOF
          tail -c 200 www/api-shim.js

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        run: npx cap add ios

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build the iOS app
        run: |
          xcodebuild -project "$PROJECT_DIR" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Add UI test target and shared scheme
        run: |
          set -e
          mkdir -p ios/App/AppUITests
          cat > ios/App/AppUITests/AppUITests.swift <<'SWIFT'
          import XCTest

          final class AppUITests: XCTestCase {

              var app: XCUIApplication!

              override func setUpWithError() throws {
                  continueAfterFailure = true
                  app = XCUIApplication()
                  app.launch()
                  addUIInterruptionMonitor(withDescription: "system-prompts") { alert in
                      for label in ["Not Now", "OK", "Allow", "Dismiss", "Maybe Later"] {
                          if alert.buttons[label].exists { alert.buttons[label].tap(); return true }
                      }
                      return false
                  }
              }

              func shot(_ name: String) {
                  let attachment = XCTAttachment(screenshot: XCUIScreen.main.screenshot())
                  attachment.name = name
                  attachment.lifetime = .keepAlways
                  add(attachment)
              }

              // Read-only diagnostics: hierarchy dump captured as a kept attachment.
              // Does not change any assertion or selector.
              func dumpHierarchy(_ name: String) {
                  let counts = "counts staticTexts=\(app.staticTexts.count) buttons=\(app.buttons.count) textFields=\(app.textFields.count) any=\(app.descendants(matching: .any).count)"
                  print("DUMP[\(name)] \(counts)")
                  let att = XCTAttachment(string: counts + "\n\n" + app.debugDescription)
                  att.name = name
                  att.lifetime = .keepAlways
                  add(att)
              }

              func textExists(_ fragment: String, _ timeout: Double = 10) -> Bool {
                  let pred = NSPredicate(format: "label CONTAINS[c] %@", fragment)
                  return app.staticTexts.matching(pred).firstMatch.waitForExistence(timeout: timeout)
              }

              func tapNav(_ label: String) {
                  let b = app.buttons[label]
                  if b.waitForExistence(timeout: 10) { b.tap() }
                  sleep(2)
              }

              // Press-drag scroll: app.swipeUp() did not move the Capacitor
              // WKWebView content in run 45325695949 (vertical scroll bar stayed
              // at 0%), leaving below-fold elements unhittable under the fixed nav.
              func dragScroll(_ times: Int = 1) {
                  let start = app.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.72))
                  let end = app.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.30))
                  for _ in 0..<times {
                      start.press(forDuration: 0.15, thenDragTo: end)
                      usleep(400000)
                  }
              }

              // Scroll until the element is actually hittable (on screen and
              // clear of the fixed bottom nav), not just present in the AX tree.
              @discardableResult
              func scrollUntilHittable(_ el: XCUIElement, _ maxDrags: Int = 10) -> Bool {
                  var n = 0
                  while !el.isHittable && n < maxDrags {
                      dragScroll()
                      n += 1
                  }
                  return el.isHittable
              }

              func testTrackerFlow() throws {
                  // Staged launch diagnosis (follow-up to the blank launch in run
                  // 45054036186): a slow first paint must be distinguishable from a
                  // stuck web view load. Probe for the gate's skip button while
                  // capturing a screenshot and hierarchy dump at about 10/20/40s
                  // after launch, then allow a long final wait. The hierarchy counts
                  // also print to the run log as DUMP[...] lines.
                  let skip = app.buttons["Skip the key and open the tracker"]
                  var waited = 0
                  let pickerProbe = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  var painted = pickerProbe.exists || skip.exists
                  for mark in [10, 20, 40] {
                      while waited < mark && !painted {
                          sleep(2)
                          waited += 2
                          painted = pickerProbe.exists || skip.exists
                      }
                      shot("00-launch-\(mark)s")
                      dumpHierarchy("dump-00-launch-\(mark)s")
                      if painted { break }
                  }
                  print("LAUNCH-DIAG painted=\(painted) waitedSeconds=\(waited)")
                  shot("01-gate")

                  // Gate -> open the tracker with the preview/sample path (native origin is not the live domain)
                  XCTAssertFalse(skip.exists, "iOS app opens without the key gate")
                  XCTAssertFalse(textExists("licence key", 1), "no licence key text on first screen")

                  // First-run onboarding (run 5 evidence + www/arc-tracker.js showFirstRun/showArchetypePicker):
                  // an auto-advancing splash, then a FULL-SCREEN archetype picker that covers the nav bar.
                  // Never touch the nav bar until the picker overlay is gone.
                  let pickerHeading = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  XCTAssertTrue(pickerHeading.waitForExistence(timeout: 25), "first-run archetype picker appears after gate skip")
                  shot("02-onboarding-picker")
                  dumpHierarchy("dump-02-picker")

                  // Pick The Strategist on the picker itself; source lands on Start Here (showTab('guide'))
                  let strat = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch
                  XCTAssertTrue(strat.waitForExistence(timeout: 10), "strategist card on the onboarding picker")
                  strat.tap()
                  var pickTries = 1
                  while !pickerHeading.waitForNonExistence(timeout: 8) && pickTries < 3 { pickTries += 1; if strat.exists && strat.isHittable { strat.tap() } }
                  print("PICK-DIAG tapsNeeded=\(pickTries)")
                  XCTAssertTrue(pickerHeading.waitForNonExistence(timeout: 15), "picker overlay dismissed after picking")
                  sleep(2)
                  shot("03-after-pick-start-here")
                  dumpHierarchy("dump-03-after-pick")

                  // Archetypes tab renders natively and marks the chosen archetype as current
                  tapNav("Archetypes")
                  shot("04-archetypes")
                  XCTAssertTrue(textExists("Know your archetype"), "archetypes tab heading")
                  XCTAssertTrue(app.buttons["This is your archetype"].firstMatch.waitForExistence(timeout: 10), "chosen archetype marked current")

                  // Setup tab: name + non-negotiable habit, then save
                  tapNav("Setup")
                  shot("05-setup")
                  XCTAssertTrue(textExists("Your habits"), "habits section on Setup")
                  XCTAssertTrue(textExists("Your weakness"), "weakness section appears once an archetype is picked")

                  let nameField = app.textFields.matching(NSPredicate(format: "placeholderValue CONTAINS[c] %@", "running this arc")).firstMatch
                  if nameField.waitForExistence(timeout: 10) {
                      nameField.tap()
                      app.typeText("Native CI Test")
                  }
                  let h1Field = app.textFields.matching(NSPredicate(format: "placeholderValue == %@", "Ex. Read one page")).firstMatch
                  if h1Field.waitForExistence(timeout: 10) {
                      h1Field.tap()
                      app.typeText("Meditate for 10 minutes")
                  }
                  // blur the field and bring the save button into view
                  for _ in 0..<3 { app.swipeUp(); usleep(300000) }
                  shot("06-setup-filled")

                  let save = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Save character")).firstMatch
                  XCTAssertTrue(save.waitForExistence(timeout: 10), "save button on Setup")
                  save.tap()
                  sleep(2)

                  // Today: the saved habit must render as a log line
                  tapNav("Today")
                  shot("07-today-configured")
                  XCTAssertTrue(textExists("Meditate for 10 minutes"), "saved habit renders on Today")

                  // Progress and Start Here tabs render natively
                  tapNav("Progress")
                  shot("08-progress")
                  XCTAssertTrue(textExists("No math on you"), "progress tab renders")

                  tapNav("Start Here")
                  shot("09-guide")
                  XCTAssertTrue(textExists("Get started"), "guide tab renders")

                  // On-phone reminders (local notifications)
                  func openReminders() {
                      let g = app.buttons.matching(NSPredicate(format: "label BEGINSWITH %@", "\u{1F514} Reminders")).firstMatch
                      _ = g.waitForExistence(timeout: 10)
                      _ = scrollUntilHittable(g, 12)
                      for _ in 0..<3 {
                          if app.buttons["Turn on notifications"].exists || app.buttons["Turn off"].exists { break }
                          if g.isHittable { g.coordinate(withNormalizedOffset: CGVector(dx: 0.1, dy: 0.5)).tap() }
                          sleep(2)
                      }
                  }
                  func remLabel() -> String {
                      let l = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Scheduled")).firstMatch
                      return l.waitForExistence(timeout: 15) ? l.label : "none"
                  }
                  tapNav("Setup")
                  openReminders()
                  let turnOn = app.buttons["Turn on notifications"]
                  _ = turnOn.waitForExistence(timeout: 10)
                  _ = scrollUntilHittable(turnOn, 10)
                  shot("R1-reminders-before")
                  if !turnOn.isHittable { dumpHierarchy("dump-R1-reminders") }
                  XCTAssertTrue(turnOn.isHittable, "Turn on notifications button in the iOS shell")
                  turnOn.tap()
                  let springboard = XCUIApplication(bundleIdentifier: "com.apple.springboard")
                  let allowBtn = springboard.alerts.buttons["Allow"]
                  let alertSeen = allowBtn.waitForExistence(timeout: 15)
                  print("REMINDER-DIAG permissionAlert=\(alertSeen)")
                  shot("R2-permission-alert")
                  if alertSeen { allowBtn.tap() }
                  let scheduledOn = remLabel()
                  print("REMINDER-DIAG scheduledAfterOn=\(scheduledOn)")
                  shot("R3-reminders-on")
                  if scheduledOn == "none" { dumpHierarchy("dump-R3-reminders") }
                  XCTAssertTrue(scheduledOn != "none", "reminders scheduled line appears after allowing notifications")

                  // One-off test notification: scheduled by the app, delivered by iOS while the app is closed, tap opens the quote reveal
                  let testBtn = app.buttons["Send a test"]
                  _ = scrollUntilHittable(testBtn, 8)
                  XCTAssertTrue(testBtn.isHittable, "Send a test button")
                  testBtn.tap()
                  sleep(2)
                  print("REMINDER-DIAG scheduledAfterTestSent=\(remLabel())")
                  shot("R4-test-sent")
                  app.terminate()
                  XCUIDevice.shared.press(.home)
                  let banner = springboard.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Your new arc quote just dropped")).firstMatch
                  let bannerSeen = banner.waitForExistence(timeout: 45)
                  print("REMINDER-DIAG bannerSeenWhileAppClosed=\(bannerSeen)")
                  shot("R5-banner")
                  if bannerSeen { banner.tap() }
                  if !bannerSeen { app.activate() }
                  _ = app.wait(for: .runningForeground, timeout: 30)
                  let skipB = app.buttons["Skip the key and open the tracker"]
                  if skipB.waitForExistence(timeout: 40) { skipB.tap(); sleep(2) }
                  let pickerB = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  if pickerB.waitForExistence(timeout: 8) { let sB = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch; if sB.waitForExistence(timeout: 10) { sB.tap(); sleep(2) } }
                  let routed = textExists("Inspired by", 25)
                  print("REMINDER-DIAG tapOpenedQuoteReveal=\(routed)")
                  shot("R6-quote-from-tap")
                  if !routed { dumpHierarchy("dump-R6-no-reveal") }
                  XCTAssertTrue(bannerSeen, "iOS delivered the test notification while the app was closed")
                  XCTAssertTrue(routed, "tapping the notification opens the quote reveal")
                  if app.buttons["Continue"].exists { app.buttons["Continue"].tap(); sleep(1) }

                  // Turn off must empty the OS queue; turning on again must refill it
                  tapNav("Setup")
                  openReminders()
                  let offBtn = app.buttons["Turn off"]
                  _ = scrollUntilHittable(offBtn, 8)
                  XCTAssertTrue(offBtn.isHittable, "Turn off button")
                  offBtn.tap()
                  let offNote = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "still scheduled on this phone")).firstMatch
                  let offOk = offNote.waitForExistence(timeout: 15)
                  print("REMINDER-DIAG afterTurnOff=\(offOk ? offNote.label : "none")")
                  shot("R7-turned-off")
                  XCTAssertTrue(offOk && offNote.label.contains("0 still scheduled"), "turn off leaves nothing scheduled")
                  let turnOn2 = app.buttons["Turn on notifications"]
                  _ = scrollUntilHittable(turnOn2, 8)
                  if turnOn2.isHittable { turnOn2.tap() }
                  let scheduledAgain = remLabel()
                  print("REMINDER-DIAG scheduledAfterReenable=\(scheduledAgain)")
                  shot("R8-turned-on-again")
                  XCTAssertTrue(scheduledAgain != "none", "turning on again schedules again")

                  // Relaunch persistence: the saved character and habit must survive
                  // an app restart (local storage inside the Capacitor shell).
                  // Probe for either the gate's skip button or the Today nav button,
                  // since it is unverified which screen a relaunch lands on.
                  app.terminate()
                  app.launch()
                  let skip2 = app.buttons["Skip the key and open the tracker"]
                  let todayNav = app.buttons["Today"]
                  var waited2 = 0
                  var painted2 = skip2.exists || todayNav.exists
                  for mark in [10, 20, 40] {
                      while waited2 < mark && !painted2 {
                          sleep(2)
                          waited2 += 2
                          painted2 = skip2.exists || todayNav.exists
                      }
                      shot("10-relaunch-\(mark)s")
                      if painted2 { break }
                  }
                  print("RELAUNCH-DIAG painted=\(painted2) waitedSeconds=\(waited2) gateShown=\(skip2.exists)")
                  if skip2.exists {
                      skip2.tap()
                      sleep(2)
                  }
                  let pickerAgain = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  if pickerAgain.waitForExistence(timeout: 8) {
                      let strat2 = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch
                      if strat2.waitForExistence(timeout: 10) { strat2.tap(); sleep(2) }
                  }
                  tapNav("Today")
                  let survived = textExists("Meditate for 10 minutes", 15)
                  shot("11-today-after-relaunch")
                  if !survived { dumpHierarchy("dump-11-relaunch") }
                  XCTAssertTrue(survived, "saved habit survives app relaunch")

                  // Scroll Today so the saved habit line is visibly on screen (not just in the AX tree)
                  let habitLine = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Meditate for 10 minutes")).firstMatch
                  XCTAssertTrue(habitLine.waitForExistence(timeout: 10), "saved habit line present on Today")
                  let habitVisible = scrollUntilHittable(habitLine, 10)
                  shot("12-today-habit-visible")
                  if !habitVisible { dumpHierarchy("dump-12-habit-not-hittable") }
                  XCTAssertTrue(habitVisible, "saved habit line scrolled into view on Today")

                  // Photo proof: the non-negotiable checks off only with proof, stored in
                  // IndexedDB on the device. A generated test image was added to the
                  // simulator photo library by the workflow; the backend stays blocked.
                  let addProof = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Add proof to check it off")).firstMatch
                  if !addProof.waitForExistence(timeout: 8) { dumpHierarchy("dump-12-no-add-proof") }
                  XCTAssertTrue(addProof.exists, "add-proof control on the non-negotiable")
                  let proofHittable = scrollUntilHittable(addProof, 8)
                  if !proofHittable { shot("12b-add-proof-not-hittable"); dumpHierarchy("dump-12b-add-proof") }
                  XCTAssertTrue(proofHittable, "add-proof control scrolled clear of the bottom nav")
                  addProof.tap()
                  let photoLib = app.buttons["Photo Library"]
                  if !photoLib.waitForExistence(timeout: 10) { shot("13a-no-picker-menu"); dumpHierarchy("dump-13a-picker-menu") }
                  XCTAssertTrue(photoLib.exists, "file-input menu offers Photo Library")
                  photoLib.tap()
                  // iOS 16+ Photos picker: the grid is PXGGridLayout images, not
                  // collectionView cells (run 45328736231 dump-13b evidence).
                  // Newest photo is first; the workflow added the test image just before.
                  let photoImgs = app.images.matching(identifier: "PXGGridLayout-Info")
                  if !photoImgs.firstMatch.waitForExistence(timeout: 90) { shot("13b-no-photo-cells"); dumpHierarchy("dump-13b-picker") }
                  XCTAssertTrue(photoImgs.firstMatch.exists, "photo picker shows the test image")
                  photoImgs.firstMatch.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap()
                  sleep(1)
                  let addBtn = app.buttons["Add"]
                  if addBtn.waitForExistence(timeout: 8) { addBtn.tap() }
                  let doneBtn = app.buttons["PUOneUpBarButtonItemIdentifierAssetExplorerReviewScreenDone"]
                  if doneBtn.waitForExistence(timeout: 8) { doneBtn.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap() }
                  let proofOk = textExists("Proof +2 XP", 20)
                  shot("13-proof-added")
                  if !proofOk { dumpHierarchy("dump-13-proof-missing") }
                  XCTAssertTrue(proofOk, "proof photo saves on-device and shows Proof +2 XP")
                  let xpOk = app.staticTexts["12"].waitForExistence(timeout: 5) && textExists("/100 XP", 2)
                  if !xpOk { dumpHierarchy("dump-13-xp") }
                  XCTAssertTrue(xpOk, "XP reflects habit check + proof (10 + 2)")
                  app.terminate()
                  app.launch()
                  let skipP = app.buttons["Skip the key and open the tracker"]
                  if skipP.exists { skipP.tap(); sleep(2) }
                  let pickerP = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  if pickerP.waitForExistence(timeout: 8) { let sP = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch; if sP.waitForExistence(timeout: 10) { sP.tap(); sleep(2) } }
                  tapNav("Today")
                  let proofKept = textExists("Proof +2 XP", 20)
                  shot("15-proof-after-relaunch")
                  if !proofKept { dumpHierarchy("dump-15-proof-after-relaunch") }
                  XCTAssertTrue(proofKept, "proof still shown after relaunch")
                  XCTAssertTrue(app.staticTexts["12"].waitForExistence(timeout: 5), "12 XP kept after relaunch")
                  let proofImg = app.buttons["Open proof"].exists ? app.buttons["Open proof"] : app.images["Your proof"]
                  XCTAssertTrue(app.buttons["Open proof"].waitForExistence(timeout: 10) || app.images["Your proof"].waitForExistence(timeout: 2), "proof thumbnail rendered from on-device storage after relaunch")
                  _ = scrollUntilHittable(proofImg, 8)
                  print("PROOF-DIAG exists=\(proofImg.exists) hittable=\(proofImg.isHittable)")
                  shot("P0-before-open-proof")
                  proofImg.tap(); sleep(5)
                  let safariP = XCUIApplication(bundleIdentifier: "com.apple.mobilesafari")
                  print("PROOF-DIAG afterTap appState=\(app.state.rawValue) safariState=\(safariP.state.rawValue)")
                  shot("P1-after-open-proof")
                  dumpHierarchy("dump-P1")
                  let closeP = app.buttons["Close proof"]
                  let overlayShown = closeP.waitForExistence(timeout: 5)
                  print("PROOF-DIAG overlayShown=\(overlayShown)")
                  XCTAssertTrue(overlayShown, "tapping the proof thumbnail opens the in-app viewer")
                  if overlayShown { closeP.tap(); sleep(2) }
                  print("PROOF-DIAG closedOk=\(!app.buttons["Close proof"].exists)")
                  shot("P2-after-close-proof")
                  XCTAssertFalse(app.buttons["Close proof"].exists, "viewer closes")
                  XCTAssertTrue(textExists("Proof +2 XP", 5), "back on Today with proof intact")
                  return
                  // Local-first: no Backup group, no key or account wording anywhere on Setup
                  tapNav("Setup")
                  for _ in 0..<6 { app.swipeUp(); usleep(300000) }
                  shot("L1-setup-bottom")
                  XCTAssertFalse(app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Backup")).firstMatch.exists, "no Backup group on Setup")
                  XCTAssertFalse(app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Backup")).firstMatch.exists, "no backup text on Setup")
                  XCTAssertFalse(app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Back up now")).firstMatch.exists, "no Back up now")
                  let moreG = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Bring over past progress")).firstMatch
                  _ = scrollUntilHittable(moreG, 6)
                  if moreG.isHittable { moreG.tap(); sleep(1) }
                  for _ in 0..<4 { app.swipeUp(); usleep(300000) }
                  shot("L2-more-group")
                  XCTAssertTrue(textExists("Erase everything", 5), "More group present")
                  XCTAssertFalse(textExists("in your backup", 1), "no backup claim in the reset copy")
                  XCTAssertFalse(textExists("signed in with your key", 1), "no key claim in the reset copy")
                  // Clear the whole day (habits 2 and 3 are still placeholders but count as due), then read the OS queue
                  tapNav("Today")
                  let hab2 = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Habit 2")).firstMatch
                  _ = scrollUntilHittable(hab2, 8)
                  hab2.tap()
                  sleep(1)
                  let hab3 = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Habit 3")).firstMatch
                  _ = scrollUntilHittable(hab3, 8)
                  hab3.tap()
                  sleep(3)
                  shot("R9a-day-cleared")
                  dumpHierarchy("dump-R9a-after-clear")
                  if app.buttons["Continue"].exists { app.buttons["Continue"].tap(); sleep(1) }
                  tapNav("Setup")
                  openReminders()
                  print("REMINDER-DIAG afterDayCleared=\(remLabel())")
                  shot("R9b-reminders-after-clear")
                  app.terminate()
                  app.launch()
                  let skipC = app.buttons["Skip the key and open the tracker"]
                  if skipC.waitForExistence(timeout: 40) { skipC.tap(); sleep(2) }
                  let pickerC = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  if pickerC.waitForExistence(timeout: 8) { let sC = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch; if sC.waitForExistence(timeout: 10) { sC.tap(); sleep(2) } }
                  tapNav("Setup")
                  openReminders()
                  print("REMINDER-DIAG afterClearedRelaunch=\(remLabel())")
                  shot("R10-reminders-after-clear-relaunch")
                  // Cold-start routing, no app.activate() (that could relaunch the instance the banner tap started)
                  func coldTap(_ tag: String, _ btnLabel: String, _ bannerText: String, _ expect: String) {
                      tapNav("Setup")
                      openReminders()
                      let b = app.buttons[btnLabel]
                      _ = scrollUntilHittable(b, 8)
                      XCTAssertTrue(b.isHittable, "\(btnLabel) button")
                      b.tap(); sleep(2)
                      app.terminate()
                      XCUIDevice.shared.press(.home)
                      let ban = springboard.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", bannerText)).firstMatch
                      let seen = ban.waitForExistence(timeout: 45)
                      print("REMINDER-DIAG \(tag)BannerSeen=\(seen)")
                      if seen { ban.tap() } else { app.activate() }
                      _ = app.wait(for: .runningForeground, timeout: 30)
                      let routed = textExists(expect, 30)
                      print("REMINDER-DIAG \(tag)Routed=\(routed)")
                      shot("R-\(tag)-from-tap")
                      if !routed { dumpHierarchy("dump-\(tag)-no-route") }
                      XCTAssertTrue(seen, "\(tag): banner delivered with app closed")
                      XCTAssertTrue(routed, "\(tag): tap opens the right screen")
                      if app.buttons["Continue"].exists { app.buttons["Continue"].tap(); sleep(1) }
                      if app.buttons["Later"].exists { app.buttons["Later"].tap(); sleep(1) }
                  }
                  coldTap("review", "Send a test review", "Your Weekly Arc Review is ready", "WEEKLY ARC REVIEW")
                  coldTap("quote2", "Send a test", "Your new arc quote just dropped", "Inspired by")
                  // Scrolled views: status-bar area must stay clear
                  tapNav("Today")
                  for _ in 0..<4 { app.swipeUp(); usleep(300000) }
                  shot("S1-today-scrolled")
                  tapNav("Setup")
                  for _ in 0..<4 { app.swipeUp(); usleep(300000) }
                  shot("S2-setup-scrolled")
                  // Import: manual streak path (asserted, persisted across relaunch), then CSV picker (best effort, not asserted)
                  func streakLabel() -> String {
                      tapNav("Progress")
                      let l = app.staticTexts.matching(NSPredicate(format: "label BEGINSWITH %@", "\u{1F525}")).firstMatch
                      _ = l.waitForExistence(timeout: 8)
                      return l.exists ? l.label : "none"
                  }
                  let streakBefore = streakLabel()
                  tapNav("Setup")
                  let moreI = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Bring over past progress")).firstMatch
                  _ = scrollUntilHittable(moreI, 8)
                  if moreI.isHittable { moreI.tap(); sleep(1) }
                  let sField = app.textFields.matching(NSPredicate(format: "placeholderValue CONTAINS[c] %@", "Days in a row")).firstMatch
                  _ = scrollUntilHittable(sField, 10)
                  XCTAssertTrue(sField.isHittable, "import streak field")
                  sField.tap(); sField.typeText("3")
                  let addDays = app.buttons["Add these days"]
                  _ = scrollUntilHittable(addDays, 6)
                  if !addDays.isHittable { app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "No file?")).firstMatch.tap(); _ = scrollUntilHittable(addDays, 6) }
                  XCTAssertTrue(addDays.isHittable, "Add these days button")
                  addDays.tap(); sleep(1)
                  let confirmAlert = app.alerts.firstMatch
                  let sawConfirm = confirmAlert.waitForExistence(timeout: 6)
                  print("IMPORT-DIAG confirmDialog=\(sawConfirm) text=\(sawConfirm ? confirmAlert.label : "")")
                  if sawConfirm { shot("I0-confirm"); let okb = confirmAlert.buttons["OK"]; if okb.exists { okb.tap() } else { confirmAlert.buttons.element(boundBy: confirmAlert.buttons.count - 1).tap() } }
                  sleep(2)
                  let streakAfter = streakLabel()
                  app.terminate(); app.launch(); sleep(3)
                  let streakRelaunch = streakLabel()
                  print("IMPORT-DIAG streakBefore=\(streakBefore) streakAfter=\(streakAfter) streakAfterRelaunch=\(streakRelaunch)")
                  shot("I1-streak-after-import-relaunch")
                  XCTAssertTrue(streakBefore != streakAfter, "importing 3 days changes the current streak")
                  XCTAssertTrue(streakAfter == streakRelaunch, "imported days persist after relaunch")
                  let netlogF = app.staticTexts.matching(NSPredicate(format: "label BEGINSWITH %@", "ZZNET")).firstMatch
                  _ = netlogF.waitForExistence(timeout: 15)
                  print("NETLOG-FINAL exists=\(netlogF.exists) " + netlogF.label)
                  shot("N1-netlog")
                  // CSV picker attempt
                  app.terminate(); app.launch(); sleep(4)
                  tapNav("Setup")
                  let moreC = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Bring over past progress")).firstMatch
                  _ = scrollUntilHittable(moreC, 8)
                  if moreC.isHittable { moreC.tap(); sleep(1) }
                  dumpHierarchy("dump-csv-more")
                  let chooseBtn = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Upload an export")).firstMatch
                  _ = scrollUntilHittable(chooseBtn, 10)
                  print("CSV-DIAG chooseButton=\(chooseBtn.exists)")
                  if chooseBtn.exists && chooseBtn.isHittable {
                      chooseBtn.tap(); sleep(3)
                      shot("I2-picker-sheet")
                      dumpHierarchy("dump-I2-picker")
                      print("CSV-DIAG appState=\(app.state.rawValue) sheetButtons=\(app.buttons.allElementsBoundByIndex.prefix(40).map{$0.label}.joined(separator: " | "))")
                      let cf = app.buttons["Choose File"].exists ? app.buttons["Choose File"] : app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Choose File")).element(boundBy: 1)
                      if cf.exists { cf.tap(); sleep(3) }
                      let browseTab = app.buttons["Browse"].exists ? app.buttons["Browse"] : app.tabBars.buttons["Browse"]
                      print("CSV-DIAG browseExists=\(browseTab.exists)")
                      if browseTab.exists { browseTab.tap(); sleep(2) }
                      shot("I3a-browse")
                      let onPhone = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "On My iPhone")).firstMatch
                      print("CSV-DIAG onMyIphone=\(onPhone.waitForExistence(timeout: 6))")
                      if onPhone.exists { onPhone.tap(); sleep(2) }
                      print("CSV-DIAG browseLabels=\(app.staticTexts.allElementsBoundByIndex.prefix(30).map{$0.label}.joined(separator: " | "))")
                      dumpHierarchy("dump-I3-browse")
                      shot("I3-files-browser")
                      let fileItem = app.staticTexts["arcimport"].exists ? app.staticTexts["arcimport"] : app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "arcimport")).firstMatch
                      print("CSV-DIAG fileVisible=\(fileItem.waitForExistence(timeout: 8))")
                      if fileItem.exists {
                          let cell = app.cells.containing(NSPredicate(format: "label CONTAINS[c] %@", "arcimport")).firstMatch
                          if cell.exists { cell.tap() } else { fileItem.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: -1.6)).tap() }
                          sleep(3)
                          print("CSV-DIAG afterFirstTapPickerStillOpen=\(app.buttons["Browse"].exists)")
                          if app.buttons["Browse"].exists && fileItem.exists { fileItem.doubleTap(); sleep(3) }
                          print("CSV-DIAG afterSecondTapPickerStillOpen=\(app.buttons["Browse"].exists)")
                      }
                      let found = textExists("Match your habits", 10)
                      print("CSV-DIAG matchScreen=\(found)")
                      shot("I4-csv-matched")
                      if found {
                          let go = app.buttons["Bring these days over"]
                          _ = scrollUntilHittable(go, 8)
                          print("CSV-DIAG goHittable=\(go.isHittable)")
                          if go.isHittable { go.tap(); sleep(2) }
                          let s2 = streakLabel()
                          print("CSV-DIAG streakAfterCsv=\(s2)")
                          shot("I5-after-csv")
                      }
                  }
                  // CALENDAR-DIAG: what the two calendar buttons do in the iPhone shell
                  app.terminate(); app.launch(); sleep(4)
                  tapNav("Setup")
                  openReminders()
                  let gcal = app.links["Add to Google Calendar"].exists ? app.links["Add to Google Calendar"] : app.staticTexts["Add to Google Calendar"]
                  _ = scrollUntilHittable(gcal, 10)
                  print("CALENDAR-DIAG googleExists=\(gcal.exists) hittable=\(gcal.isHittable)")
                  shot("C0-calendar-card")
                  if gcal.isHittable {
                      gcal.tap(); sleep(5)
                      let safari = XCUIApplication(bundleIdentifier: "com.apple.mobilesafari")
                      print("CALENDAR-DIAG afterGoogleTap appState=\(app.state.rawValue) safariState=\(safari.state.rawValue)")
                      shot("C1-after-google-tap")
                      dumpHierarchy("dump-C1")
                  }
                  app.terminate(); app.launch(); sleep(4)
                  tapNav("Setup")
                  openReminders()
                  let icsBtn = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", ".ics")).firstMatch
                  _ = scrollUntilHittable(icsBtn, 10)
                  print("CALENDAR-DIAG icsExists=\(icsBtn.exists) hittable=\(icsBtn.isHittable)")
                  if icsBtn.isHittable {
                      icsBtn.tap(); sleep(4)
                      let sb2 = XCUIApplication(bundleIdentifier: "com.apple.springboard")
                      print("CALENDAR-DIAG afterIcsTap appState=\(app.state.rawValue) alerts=\(app.alerts.count) sheets=\(app.sheets.count) sbAlerts=\(sb2.alerts.count)")
                      let shareUp = app.otherElements["ActivityListView"].exists || app.navigationBars["UIActivityContentView"].exists || app.buttons["Copy"].exists || app.collectionViews.cells.count > 0
                      print("CALENDAR-DIAG shareSheetVisible=\(shareUp)")
                      shot("C2-after-ics-tap")
                      dumpHierarchy("dump-C2")
                  }
                  return

                  // Backend unreachable: backup must fail gracefully with a clear message.
                  // The API host has been hosts-blocked for this whole run, so every local
                  // step above already ran without a backend; this checks the visible signal.
                  tapNav("Setup")
                  let backupGroup = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Backup")).firstMatch
                  _ = scrollUntilHittable(backupGroup, 10)
                  if backupGroup.isHittable { backupGroup.tap(); sleep(1) }
                  let syncNowBtn = app.buttons["Back up now"]
                  _ = syncNowBtn.waitForExistence(timeout: 8)
                  _ = scrollUntilHittable(syncNowBtn, 8)
                  XCTAssertTrue(syncNowBtn.waitForExistence(timeout: 8), "Back up now button in the Backup group")
                  syncNowBtn.tap()
                  let unreachable = textExists("Couldn't reach the backup", 20) || textExists("offline", 20)
                  shot("14-backup-unreachable")
                  if !unreachable { dumpHierarchy("dump-14-backup") }
                  XCTAssertTrue(unreachable, "unreachable backend shows a clear backup message")
              }
          }
          SWIFT

          cat > /tmp/inject.rb <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = proj.targets.find { |t| t.name == 'App' } or abort 'App target not found'
          abort 'AppUITests already exists' if proj.targets.any? { |t| t.name == 'AppUITests' }
          uitest = proj.new_target(:ui_test_bundle, 'AppUITests', :ios, '15.0', nil, :swift)
          grp = proj.main_group.new_group('AppUITests', 'AppUITests')
          ref = grp.new_file('AppUITests.swift')
          uitest.source_build_phase.add_file_reference(ref)
          uitest.add_dependency(app)
          uitest.build_configurations.each do |c|
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.animemindset.arctracker.uitests'
            c.build_settings['PRODUCT_NAME'] = '$(TARGET_NAME)'
            c.build_settings['TEST_TARGET_NAME'] = 'App'
            c.build_settings['SWIFT_VERSION'] = '5.0'
            c.build_settings['GENERATE_INFOPLIST_FILE'] = 'YES'
            c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
            c.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
            c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            c.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
          end
          proj.save
          puts "APP_UUID=#{app.uuid}"
          puts "UITEST_UUID=#{uitest.uuid}"
          RUBY

          RUBY_BIN=$(head -1 "$(command -v pod)" | sed 's/^#!//')
          "$RUBY_BIN" /tmp/inject.rb | tee /tmp/uuids.txt
          APP_UUID=$(grep '^APP_UUID=' /tmp/uuids.txt | cut -d= -f2)
          UITEST_UUID=$(grep '^UITEST_UUID=' /tmp/uuids.txt | cut -d= -f2)
          [ -n "$APP_UUID" ] && [ -n "$UITEST_UUID" ] || { echo 'uuid capture failed'; exit 1; }

          cat > /tmp/scheme.tpl <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "2600"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES"
                buildArchitectures = "Automatic">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "__APP_UUID__"
                         BuildableName = "App.app"
                         BlueprintName = "App"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">
                <Testables>
                   <TestableReference
                      skipped = "NO"
                      parallelizable = "NO">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "__UITEST_UUID__"
                         BuildableName = "AppUITests.xctest"
                         BlueprintName = "AppUITests"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </TestableReference>
                </Testables>
             </TestAction>
             <LaunchAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "__APP_UUID__"
                      BuildableName = "App.app"
                      BlueprintName = "App"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "__APP_UUID__"
                      BuildableName = "App.app"
                      BlueprintName = "App"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          SCHEME

          mkdir -p "$PROJECT_DIR/xcshareddata/xcschemes"
          sed -e "s/__APP_UUID__/$APP_UUID/g" -e "s/__UITEST_UUID__/$UITEST_UUID/g" \
            /tmp/scheme.tpl > "$PROJECT_DIR/xcshareddata/xcschemes/App.xcscheme"
          echo 'shared scheme written:'
          grep -c 'BuildableReference' "$PROJECT_DIR/xcshareddata/xcschemes/App.xcscheme"

      - name: Show UI test target build settings
        run: |
          xcodebuild -project "$PROJECT_DIR" -list
          xcodebuild -project "$PROJECT_DIR" -target AppUITests -configuration Debug -sdk iphonesimulator -showBuildSettings | grep -E ' (PRODUCT_NAME|FULL_PRODUCT_NAME|WRAPPER_NAME|PRODUCT_BUNDLE_IDENTIFIER|TEST_TARGET_NAME) = '

      - name: Boot the iPhone simulator
        run: |
          set -e
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)
          ids=[t["identifier"] for t in d["devicetypes"] if re.search(r"iPhone-1[6-9]", t["identifier"])]
          print(sorted(ids)[-1] if ids else "com.apple.CoreSimulator.SimDeviceType.iPhone-15")')
          UDID=$(xcrun simctl create arctracker "$TYPE" 2>/dev/null || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          ids=[]
          for rt,devs in d["devices"].items():
            if "iOS" in rt:
              for dev in devs:
                if dev.get("isAvailable") and "iPhone 1" in dev["name"]:
                  ids.append(dev["udid"])
          print(ids[-1] if ids else "")')
          fi
          [ -n "$UDID" ] || { echo 'no simulator available'; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 5

      - name: Add a test photo to the simulator library
        run: |
          set -e
          printf '%s' '' | base64 --decode > /tmp/proof.png
          ls -la /tmp/proof.png
          xcrun simctl addmedia "$UDID" /tmp/proof.png

      - name: Place a CSV fixture where the iOS file picker can see it (best effort)
        run: |
          set +e
          D1=$(date -v-4d +%F); D2=$(date -v-3d +%F); D3=$(date -v-2d +%F)
          printf 'date,habit\n%s,Meditate\n%s,Meditate\n%s,Meditate\n%s,Read\n' "$D1" "$D2" "$D3" "$D3" > /tmp/arcimport.csv
          cat /tmp/arcimport.csv
          xcrun simctl launch "$UDID" com.apple.DocumentsApp; sleep 6
          xcrun simctl terminate "$UDID" com.apple.DocumentsApp
          DATA="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data"
          FPS=$(find "$DATA/Containers/Shared/AppGroup" -maxdepth 4 -type d -name "File Provider Storage" 2>/dev/null | head -1)
          echo "File Provider Storage: $FPS"
          if [ -n "$FPS" ]; then cp /tmp/arcimport.csv "$FPS/arcimport.csv"; ls -la "$FPS"; fi

      - name: Start bounded network trace
        run: |
          date -u +%FT%TZ | tee /tmp/trace-start.txt
          sudo nohup tcpdump -i any -nn -w /tmp/net.pcap >/tmp/tcpdump.log 2>&1 &
          sleep 3
          pgrep tcpdump || echo "tcpdump not running"

      - name: Run the XCUITest tracker flow
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_DIR" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath /tmp/arcrest.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild-test.log
        timeout-minutes: 45

      - name: Stop trace and summarize
        if: always()
        run: |
          set +e +o pipefail
          sudo pkill tcpdump || true
          sleep 2
          date -u +%FT%TZ
          ls -la /tmp/net.pcap || true
          echo "NETTRACE total packets:"; sudo tcpdump -nn -r /tmp/net.pcap 2>/dev/null | wc -l
          echo "NETTRACE DNS names asked (count name):"; sudo tcpdump -nn -r /tmp/net.pcap 'udp port 53' 2>/dev/null | grep -o ' [A-Z]*? [^ ]*' | sort | uniq -c | sort -rn | head -40

      - name: Trace destinations
        if: always()
        run: |
          set +e +o pipefail
          sudo tcpdump -nn -r /tmp/net.pcap 2>/dev/null | grep 'Flags \[S\]' > /tmp/syn.txt || true
          echo "NETTRACE TCP SYN packets total: $(wc -l < /tmp/syn.txt)"
          echo "NETTRACE SYNs to 127.0.0.1 (blocked-host attempts by app or runner): $(grep -c '> 127.0.0.1\.' /tmp/syn.txt)"
          echo "NETTRACE SYN to 127.0.0.1 ports:"; grep '> 127.0.0.1\.' /tmp/syn.txt | grep -o '> 127.0.0.1\.[0-9]*' | sort | uniq -c | sort -rn | head -10
          echo "NETTRACE SYN destinations excluding loopback (count dest):"
          grep -v '> 127.0.0.1\.' /tmp/syn.txt | awk '{for(i=1;i<=NF;i++) if($i==">"){d=$(i+1); sub(/:$/,"",d); print d}}' | sort | uniq -c | sort -rn | head -25
          echo "NETTRACE end"

      - name: Export the test screenshots
        if: always()
        run: |
          set -e
          mkdir -p shots
          xcrun xcresulttool export attachments --path /tmp/arcrest.xcresult --output-path shots
          ls -la shots
          rm -f shots/*.mp4
          for f in shots/*_*.png; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            new=$(echo "$base" | sed -E 's/_[A-F0-9a-f-]{36}\.png$/.png/')
            mv "$f" "shots/$new"
          done
          ls -la shots

      - name: Downscale screenshots for the artifact
        if: always()
        run: |
          for f in shots/*.png; do
            [ -e "$f" ] || continue
            sips -Z 1320 "$f" --out "$f" >/dev/null 2>&1 || true
          done
          ls -la shots/

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-shots-${{ github.run_id }}
          path: shots/*

      - name: Push screenshots to a scratch branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "ci@localhost"
          git config user.name "ci"
          BR="native-uitest-${{ github.run_id }}"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"
          rm -rf /tmp/shotpush && mkdir -p /tmp/shotpush
          cd /tmp/shotpush
          git init -q
          git checkout -q -b "$BR"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          cp "$GITHUB_WORKSPACE"/shots/* . 2>/dev/null || true
          cat > RUN.md <<EOF2
          # Native simulator UI test screenshots

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Captured by an XCUITest UI-test target injected into the Capacitor project during CI,
          driving the real app shell on an iPhone simulator: gate, the first-run archetype
          picker (choosing The Strategist), Start Here after the pick, the Archetypes tab,
          Setup (saving a synthetic name + habit), the configured Today log line, and Progress.

          The name "Native CI Test" and habit "Meditate for 10 minutes" are synthetic test data
          that live only in the simulator's local storage. During this run the production API
          host (animemindset.com) was pinned to 127.0.0.1 in the runner's /etc/hosts (verified
          by a failing curl in the run log), so no request from the app could leave for
          production. These are native simulator renders of the prototype web app inside the
          Capacitor shell via the preview/sample key path. This does not test real sync,
          real devices, the camera, or push.
          EOF2
          git add .
          git commit -q -m "Native UI test screenshots for run ${{ github.run_id }}"
          git push -q origin "$BR"
          echo "Pushed screenshots to branch $BR"
