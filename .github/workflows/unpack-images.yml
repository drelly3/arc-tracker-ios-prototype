name: Unpack staged images (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode staged images into www/
        run: |
          set -euo pipefail
          cd www
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line#*  }"
            out=$(printf '%s' "$path" | tr '/' '_')
            mkdir -p "$(dirname "$path")"
            base64 -d "../.image-staging/${out}.b64" > "$path"
            echo "decoded $path"
          done < ../.image-staging/sha256-manifest.txt

      - name: Verify every image byte-for-byte
        run: |
          set -euo pipefail
          cd www
          sha256sum -c ../.image-staging/sha256-manifest.txt

      - name: Commit images and remove temporary staging and this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .image-staging .github/workflows/unpack-images.yml www/assets/.gitkeep www/assets/avatars/.gitkeep
          git add -A
          git commit -m "Add 18 verified image assets; remove one-off staging workflow"
          git push
