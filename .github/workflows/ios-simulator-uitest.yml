name: iOS simulator UI test run
on:
  workflow_dispatch:

# Only the sim-test job below may write (it pushes screenshots to a scratch branch).
permissions: {}

env:
  PROJECT_DIR: ios/App/App.xcodeproj
  SCHEME: App
  DERIVED: build/DerivedData

jobs:
  sim-test:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block production API egress for the test
        run: |
          set -e
          echo '127.0.0.1 animemindset.com' | sudo tee -a /etc/hosts
          echo '127.0.0.1 www.animemindset.com' | sudo tee -a /etc/hosts
          grep animemindset /etc/hosts
          if curl -sS -m 5 https://animemindset.com/api/arc-verify -o /dev/null 2>/tmp/curlerr; then
            echo 'ERROR: production API host still reachable'; exit 1
          else
            echo "production API host blocked as intended: $(cat /tmp/curlerr)"
          fi

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        run: npx cap add ios

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build the iOS app
        run: |
          xcodebuild -project "$PROJECT_DIR" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Add UI test target and shared scheme
        run: |
          set -e
          mkdir -p ios/App/AppUITests
          cat > ios/App/AppUITests/AppUITests.swift <<'SWIFT'
          import XCTest

          final class AppUITests: XCTestCase {

              var app: XCUIApplication!

              override func setUpWithError() throws {
                  continueAfterFailure = true
                  app = XCUIApplication()
                  app.launch()
                  addUIInterruptionMonitor(withDescription: "system-prompts") { alert in
                      for label in ["Not Now", "OK", "Allow", "Dismiss", "Maybe Later"] {
                          if alert.buttons[label].exists { alert.buttons[label].tap(); return true }
                      }
                      return false
                  }
              }

              func shot(_ name: String) {
                  let attachment = XCTAttachment(screenshot: XCUIScreen.main.screenshot())
                  attachment.name = name
                  attachment.lifetime = .keepAlways
                  add(attachment)
              }

              // Read-only diagnostics: hierarchy dump captured as a kept attachment.
              // Does not change any assertion or selector.
              func dumpHierarchy(_ name: String) {
                  let counts = "counts staticTexts=\(app.staticTexts.count) buttons=\(app.buttons.count) textFields=\(app.textFields.count) any=\(app.descendants(matching: .any).count)"
                  print("DUMP[\(name)] \(counts)")
                  let att = XCTAttachment(string: counts + "\n\n" + app.debugDescription)
                  att.name = name
                  att.lifetime = .keepAlways
                  add(att)
              }

              func textExists(_ fragment: String, _ timeout: Double = 10) -> Bool {
                  let pred = NSPredicate(format: "label CONTAINS[c] %@", fragment)
                  return app.staticTexts.matching(pred).firstMatch.waitForExistence(timeout: timeout)
              }

              func tapNav(_ label: String) {
                  let b = app.buttons[label]
                  if b.waitForExistence(timeout: 10) { b.tap() }
                  sleep(2)
              }

              // Press-drag scroll: app.swipeUp() did not move the Capacitor
              // WKWebView content in run 45325695949 (vertical scroll bar stayed
              // at 0%), leaving below-fold elements unhittable under the fixed nav.
              func dragScroll(_ times: Int = 1) {
                  let start = app.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.72))
                  let end = app.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.30))
                  for _ in 0..<times {
                      start.press(forDuration: 0.15, thenDragTo: end)
                      usleep(400000)
                  }
              }

              // Scroll until the element is actually hittable (on screen and
              // clear of the fixed bottom nav), not just present in the AX tree.
              @discardableResult
              func scrollUntilHittable(_ el: XCUIElement, _ maxDrags: Int = 10) -> Bool {
                  var n = 0
                  while !el.isHittable && n < maxDrags {
                      dragScroll()
                      n += 1
                  }
                  return el.isHittable
              }

              func testTrackerFlow() throws {
                  // Staged launch diagnosis (follow-up to the blank launch in run
                  // 45054036186): a slow first paint must be distinguishable from a
                  // stuck web view load. Probe for the gate's skip button while
                  // capturing a screenshot and hierarchy dump at about 10/20/40s
                  // after launch, then allow a long final wait. The hierarchy counts
                  // also print to the run log as DUMP[...] lines.
                  let skip = app.buttons["Skip the key and open the tracker"]
                  var waited = 0
                  var painted = skip.exists
                  for mark in [10, 20, 40] {
                      while waited < mark && !painted {
                          sleep(2)
                          waited += 2
                          painted = skip.exists
                      }
                      shot("00-launch-\(mark)s")
                      dumpHierarchy("dump-00-launch-\(mark)s")
                      if painted { break }
                  }
                  print("LAUNCH-DIAG painted=\(painted) waitedSeconds=\(waited)")
                  shot("01-gate")

                  // Gate -> open the tracker with the preview/sample path (native origin is not the live domain)
                  XCTAssertTrue(skip.waitForExistence(timeout: 60), "preview skip button on the gate")
                  skip.tap()

                  // First-run onboarding (run 5 evidence + www/arc-tracker.js showFirstRun/showArchetypePicker):
                  // an auto-advancing splash, then a FULL-SCREEN archetype picker that covers the nav bar.
                  // Never touch the nav bar until the picker overlay is gone.
                  let pickerHeading = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  XCTAssertTrue(pickerHeading.waitForExistence(timeout: 25), "first-run archetype picker appears after gate skip")
                  shot("02-onboarding-picker")
                  dumpHierarchy("dump-02-picker")

                  // Pick The Strategist on the picker itself; source lands on Start Here (showTab('guide'))
                  let strat = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch
                  XCTAssertTrue(strat.waitForExistence(timeout: 10), "strategist card on the onboarding picker")
                  strat.tap()
                  XCTAssertTrue(pickerHeading.waitForNonExistence(timeout: 15), "picker overlay dismissed after picking")
                  sleep(2)
                  shot("03-after-pick-start-here")
                  dumpHierarchy("dump-03-after-pick")

                  // Archetypes tab renders natively and marks the chosen archetype as current
                  tapNav("Archetypes")
                  shot("04-archetypes")
                  XCTAssertTrue(textExists("Know your archetype"), "archetypes tab heading")
                  XCTAssertTrue(app.buttons["This is your archetype"].firstMatch.waitForExistence(timeout: 10), "chosen archetype marked current")

                  // Setup tab: name + non-negotiable habit, then save
                  tapNav("Setup")
                  shot("05-setup")
                  XCTAssertTrue(textExists("Your habits"), "habits section on Setup")
                  XCTAssertTrue(textExists("Your weakness"), "weakness section appears once an archetype is picked")

                  let nameField = app.textFields.matching(NSPredicate(format: "placeholderValue CONTAINS[c] %@", "running this arc")).firstMatch
                  if nameField.waitForExistence(timeout: 10) {
                      nameField.tap()
                      app.typeText("Native CI Test")
                  }
                  let h1Field = app.textFields.matching(NSPredicate(format: "placeholderValue == %@", "Ex. Read one page")).firstMatch
                  if h1Field.waitForExistence(timeout: 10) {
                      h1Field.tap()
                      app.typeText("Meditate for 10 minutes")
                  }
                  // blur the field and bring the save button into view
                  for _ in 0..<3 { app.swipeUp(); usleep(300000) }
                  shot("06-setup-filled")

                  let save = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "Save character")).firstMatch
                  XCTAssertTrue(save.waitForExistence(timeout: 10), "save button on Setup")
                  save.tap()
                  sleep(2)

                  // Today: the saved habit must render as a log line
                  tapNav("Today")
                  shot("07-today-configured")
                  XCTAssertTrue(textExists("Meditate for 10 minutes"), "saved habit renders on Today")

                  // Progress and Start Here tabs render natively
                  tapNav("Progress")
                  shot("08-progress")
                  XCTAssertTrue(textExists("No math on you"), "progress tab renders")

                  tapNav("Start Here")
                  shot("09-guide")
                  XCTAssertTrue(textExists("Get started"), "guide tab renders")

                  // Relaunch persistence: the saved character and habit must survive
                  // an app restart (local storage inside the Capacitor shell).
                  // Probe for either the gate's skip button or the Today nav button,
                  // since it is unverified which screen a relaunch lands on.
                  app.terminate()
                  app.launch()
                  let skip2 = app.buttons["Skip the key and open the tracker"]
                  let todayNav = app.buttons["Today"]
                  var waited2 = 0
                  var painted2 = skip2.exists || todayNav.exists
                  for mark in [10, 20, 40] {
                      while waited2 < mark && !painted2 {
                          sleep(2)
                          waited2 += 2
                          painted2 = skip2.exists || todayNav.exists
                      }
                      shot("10-relaunch-\(mark)s")
                      if painted2 { break }
                  }
                  print("RELAUNCH-DIAG painted=\(painted2) waitedSeconds=\(waited2) gateShown=\(skip2.exists)")
                  if skip2.waitForExistence(timeout: 30) {
                      skip2.tap()
                      sleep(2)
                  }
                  let pickerAgain = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  if pickerAgain.waitForExistence(timeout: 8) {
                      let strat2 = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch
                      if strat2.waitForExistence(timeout: 10) { strat2.tap(); sleep(2) }
                  }
                  tapNav("Today")
                  let survived = textExists("Meditate for 10 minutes", 15)
                  shot("11-today-after-relaunch")
                  if !survived { dumpHierarchy("dump-11-relaunch") }
                  XCTAssertTrue(survived, "saved habit survives app relaunch")

                  // Scroll Today so the saved habit line is visibly on screen (not just in the AX tree)
                  let habitLine = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Meditate for 10 minutes")).firstMatch
                  XCTAssertTrue(habitLine.waitForExistence(timeout: 10), "saved habit line present on Today")
                  let habitVisible = scrollUntilHittable(habitLine, 10)
                  shot("12-today-habit-visible")
                  if !habitVisible { dumpHierarchy("dump-12-habit-not-hittable") }
                  XCTAssertTrue(habitVisible, "saved habit line scrolled into view on Today")

                  // Photo proof: the non-negotiable checks off only with proof, stored in
                  // IndexedDB on the device. A generated test image was added to the
                  // simulator photo library by the workflow; the backend stays blocked.
                  let addProof = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Add proof to check it off")).firstMatch
                  if !addProof.waitForExistence(timeout: 8) { dumpHierarchy("dump-12-no-add-proof") }
                  XCTAssertTrue(addProof.exists, "add-proof control on the non-negotiable")
                  let proofHittable = scrollUntilHittable(addProof, 8)
                  if !proofHittable { shot("12b-add-proof-not-hittable"); dumpHierarchy("dump-12b-add-proof") }
                  XCTAssertTrue(proofHittable, "add-proof control scrolled clear of the bottom nav")
                  addProof.tap()
                  let photoLib = app.buttons["Photo Library"]
                  if !photoLib.waitForExistence(timeout: 10) { shot("13a-no-picker-menu"); dumpHierarchy("dump-13a-picker-menu") }
                  XCTAssertTrue(photoLib.exists, "file-input menu offers Photo Library")
                  photoLib.tap()
                  // iOS 16+ Photos picker: the grid is PXGGridLayout images, not
                  // collectionView cells (run 45328736231 dump-13b evidence).
                  // Newest photo is first; the workflow added the test image just before.
                  let photoImgs = app.images.matching(identifier: "PXGGridLayout-Info")
                  if !photoImgs.firstMatch.waitForExistence(timeout: 90) { shot("13b-no-photo-cells"); dumpHierarchy("dump-13b-picker") }
                  XCTAssertTrue(photoImgs.firstMatch.exists, "photo picker shows the test image")
                  photoImgs.firstMatch.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap()
                  sleep(1)
                  let addBtn = app.buttons["Add"]
                  if addBtn.waitForExistence(timeout: 8) { addBtn.tap() }
                  let doneBtn = app.buttons["PUOneUpBarButtonItemIdentifierAssetExplorerReviewScreenDone"]
                  if doneBtn.waitForExistence(timeout: 8) { doneBtn.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap() }
                  let proofOk = textExists("Proof +2 XP", 20)
                  shot("13-proof-added")
                  if !proofOk { dumpHierarchy("dump-13-proof-missing") }
                  XCTAssertTrue(proofOk, "proof photo saves on-device and shows Proof +2 XP")
                  let xpOk = app.staticTexts["12"].waitForExistence(timeout: 5) && textExists("/100 XP", 2)
                  if !xpOk { dumpHierarchy("dump-13-xp") }
                  XCTAssertTrue(xpOk, "XP reflects habit check + proof (10 + 2)")
                  app.terminate()
                  app.launch()
                  let skipP = app.buttons["Skip the key and open the tracker"]
                  if skipP.waitForExistence(timeout: 40) { skipP.tap(); sleep(2) }
                  let pickerP = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Which one are you")).firstMatch
                  if pickerP.waitForExistence(timeout: 8) { let sP = app.buttons.matching(NSPredicate(format: "label CONTAINS[c] %@", "The Strategist")).firstMatch; if sP.waitForExistence(timeout: 10) { sP.tap(); sleep(2) } }
                  tapNav("Today")
                  let proofKept = textExists("Proof +2 XP", 20)
                  shot("15-proof-after-relaunch")
                  if !proofKept { dumpHierarchy("dump-15-proof-after-relaunch") }
                  XCTAssertTrue(proofKept, "proof still shown after relaunch")
                  XCTAssertTrue(app.staticTexts["12"].waitForExistence(timeout: 5), "12 XP kept after relaunch")
                  XCTAssertTrue(app.images["Your proof"].waitForExistence(timeout: 10), "proof thumbnail rendered from on-device storage after relaunch")
                  return

                  // Backend unreachable: backup must fail gracefully with a clear message.
                  // The API host has been hosts-blocked for this whole run, so every local
                  // step above already ran without a backend; this checks the visible signal.
                  tapNav("Setup")
                  let backupGroup = app.staticTexts.matching(NSPredicate(format: "label CONTAINS[c] %@", "Backup")).firstMatch
                  _ = scrollUntilHittable(backupGroup, 10)
                  if backupGroup.isHittable { backupGroup.tap(); sleep(1) }
                  let syncNowBtn = app.buttons["Back up now"]
                  _ = syncNowBtn.waitForExistence(timeout: 8)
                  _ = scrollUntilHittable(syncNowBtn, 8)
                  XCTAssertTrue(syncNowBtn.waitForExistence(timeout: 8), "Back up now button in the Backup group")
                  syncNowBtn.tap()
                  let unreachable = textExists("Couldn't reach the backup", 20) || textExists("offline", 20)
                  shot("14-backup-unreachable")
                  if !unreachable { dumpHierarchy("dump-14-backup") }
                  XCTAssertTrue(unreachable, "unreachable backend shows a clear backup message")
              }
          }
          SWIFT

          cat > /tmp/inject.rb <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = proj.targets.find { |t| t.name == 'App' } or abort 'App target not found'
          abort 'AppUITests already exists' if proj.targets.any? { |t| t.name == 'AppUITests' }
          uitest = proj.new_target(:ui_test_bundle, 'AppUITests', :ios, '15.0', nil, :swift)
          grp = proj.main_group.new_group('AppUITests', 'AppUITests')
          ref = grp.new_file('AppUITests.swift')
          uitest.source_build_phase.add_file_reference(ref)
          uitest.add_dependency(app)
          uitest.build_configurations.each do |c|
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.animemindset.arctracker.uitests'
            c.build_settings['PRODUCT_NAME'] = '$(TARGET_NAME)'
            c.build_settings['TEST_TARGET_NAME'] = 'App'
            c.build_settings['SWIFT_VERSION'] = '5.0'
            c.build_settings['GENERATE_INFOPLIST_FILE'] = 'YES'
            c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
            c.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
            c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            c.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
          end
          proj.save
          puts "APP_UUID=#{app.uuid}"
          puts "UITEST_UUID=#{uitest.uuid}"
          RUBY

          RUBY_BIN=$(head -1 "$(command -v pod)" | sed 's/^#!//')
          "$RUBY_BIN" /tmp/inject.rb | tee /tmp/uuids.txt
          APP_UUID=$(grep '^APP_UUID=' /tmp/uuids.txt | cut -d= -f2)
          UITEST_UUID=$(grep '^UITEST_UUID=' /tmp/uuids.txt | cut -d= -f2)
          [ -n "$APP_UUID" ] && [ -n "$UITEST_UUID" ] || { echo 'uuid capture failed'; exit 1; }

          cat > /tmp/scheme.tpl <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "2600"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES"
                buildArchitectures = "Automatic">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "__APP_UUID__"
                         BuildableName = "App.app"
                         BlueprintName = "App"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">
                <Testables>
                   <TestableReference
                      skipped = "NO"
                      parallelizable = "NO">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "__UITEST_UUID__"
                         BuildableName = "AppUITests.xctest"
                         BlueprintName = "AppUITests"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </TestableReference>
                </Testables>
             </TestAction>
             <LaunchAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "__APP_UUID__"
                      BuildableName = "App.app"
                      BlueprintName = "App"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "__APP_UUID__"
                      BuildableName = "App.app"
                      BlueprintName = "App"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          SCHEME

          mkdir -p "$PROJECT_DIR/xcshareddata/xcschemes"
          sed -e "s/__APP_UUID__/$APP_UUID/g" -e "s/__UITEST_UUID__/$UITEST_UUID/g" \
            /tmp/scheme.tpl > "$PROJECT_DIR/xcshareddata/xcschemes/App.xcscheme"
          echo 'shared scheme written:'
          grep -c 'BuildableReference' "$PROJECT_DIR/xcshareddata/xcschemes/App.xcscheme"

      - name: Show UI test target build settings
        run: |
          xcodebuild -project "$PROJECT_DIR" -list
          xcodebuild -project "$PROJECT_DIR" -target AppUITests -configuration Debug -sdk iphonesimulator -showBuildSettings | grep -E ' (PRODUCT_NAME|FULL_PRODUCT_NAME|WRAPPER_NAME|PRODUCT_BUNDLE_IDENTIFIER|TEST_TARGET_NAME) = '

      - name: Boot the iPhone simulator
        run: |
          set -e
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)
          ids=[t["identifier"] for t in d["devicetypes"] if re.search(r"iPhone-1[6-9]", t["identifier"])]
          print(sorted(ids)[-1] if ids else "com.apple.CoreSimulator.SimDeviceType.iPhone-15")')
          UDID=$(xcrun simctl create arctracker "$TYPE" 2>/dev/null || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          ids=[]
          for rt,devs in d["devices"].items():
            if "iOS" in rt:
              for dev in devs:
                if dev.get("isAvailable") and "iPhone 1" in dev["name"]:
                  ids.append(dev["udid"])
          print(ids[-1] if ids else "")')
          fi
          [ -n "$UDID" ] || { echo 'no simulator available'; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 5

      - name: Add a test photo to the simulator library
        run: |
          set -e
          printf '%s' '' | base64 --decode > /tmp/proof.png
          ls -la /tmp/proof.png
          xcrun simctl addmedia "$UDID" /tmp/proof.png

      - name: Start network capture (DNS queries and TCP connection attempts)
        run: |
          sudo nohup tcpdump -nn -tttt -l -i any '(udp port 53) or (tcp[tcpflags] & tcp-syn != 0)' > /tmp/net-capture.txt 2>/tmp/tcpdump.err &
          sleep 3
          date -u '+capture started %Y-%m-%d %H:%M:%S UTC' | tee /tmp/net-markers.txt

      - name: Run the XCUITest tracker flow
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_DIR" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath /tmp/arcrest.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild-test.log
        timeout-minutes: 25

      - name: Stop network capture and keep built icon and splash
        if: always()
        run: |
          date -u '+test finished %Y-%m-%d %H:%M:%S UTC' | tee -a /tmp/net-markers.txt
          sudo pkill tcpdump || true
          sleep 2
          mkdir -p shots
          cat /tmp/net-markers.txt /tmp/tcpdump.err > shots/network-markers.txt 2>/dev/null || true
          cp /tmp/net-capture.txt shots/network-capture.txt || true
          wc -l shots/network-capture.txt || true
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png shots/built-appicon.png || true
          cp ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png shots/built-splash.png || true

      - name: Export the test screenshots
        if: always()
        run: |
          set -e
          mkdir -p shots
          xcrun xcresulttool export attachments --path /tmp/arcrest.xcresult --output-path shots
          ls -la shots
          for f in shots/*_*.png; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            new=$(echo "$base" | sed -E 's/_[A-F0-9a-f-]{36}\.png$/.png/')
            mv "$f" "shots/$new"
          done
          ls -la shots

      - name: Downscale screenshots for the artifact
        if: always()
        run: |
          for f in shots/*.png; do
            [ -e "$f" ] || continue
            sips -Z 1320 "$f" --out "$f" >/dev/null 2>&1 || true
          done
          ls -la shots/

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-shots-${{ github.run_id }}
          path: shots/*

      - name: Push screenshots to a scratch branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "ci@localhost"
          git config user.name "ci"
          BR="native-uitest-${{ github.run_id }}"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"
          rm -rf /tmp/shotpush && mkdir -p /tmp/shotpush
          cd /tmp/shotpush
          git init -q
          git checkout -q -b "$BR"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          cp "$GITHUB_WORKSPACE"/shots/* . 2>/dev/null || true
          cat > RUN.md <<EOF2
          # Native simulator UI test screenshots

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Captured by an XCUITest UI-test target injected into the Capacitor project during CI,
          driving the real app shell on an iPhone simulator: gate, the first-run archetype
          picker (choosing The Strategist), Start Here after the pick, the Archetypes tab,
          Setup (saving a synthetic name + habit), the configured Today log line, and Progress.

          The name "Native CI Test" and habit "Meditate for 10 minutes" are synthetic test data
          that live only in the simulator's local storage. During this run the production API
          host (animemindset.com) was pinned to 127.0.0.1 in the runner's /etc/hosts (verified
          by a failing curl in the run log), so no request from the app could leave for
          production. These are native simulator renders of the prototype web app inside the
          Capacitor shell via the preview/sample key path. This does not test real sync,
          real devices, the camera, or push.
          EOF2
          git add .
          git commit -q -m "Native UI test screenshots for run ${{ github.run_id }}"
          git push -q origin "$BR"
          echo "Pushed screenshots to branch $BR"
