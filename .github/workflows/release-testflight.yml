name: iOS TestFlight upload (release)

# Manual trigger only. Runs only on the release-ios branch, inside the "appstore"
# environment, which needs the owner's approval click before any secret is released.
# Uploads a signed build to App Store Connect / TestFlight. It does NOT submit for review
# and does NOT publish anything.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/release-ios'
    runs-on: macos-26
    environment: appstore
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the iOS platform and sync web assets
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Add the on-device insight plugin
        run: bash native/inject-arc-insight.sh

      - name: Configure app (icon, iPhone-only, encryption flag, permission text)
        run: |
          set -euo pipefail
          test -f release/1-AppIcon-1024.png   # stop here rather than ship the placeholder icon
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp release/1-AppIcon-1024.png "$ICONSET/AppIcon-512@2x.png"
          PL=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"
          $PB -c "Add :NSCameraUsageDescription string Arc Tracker uses your camera only when you choose to take a photo or video as proof of a habit." "$PL"
          $PB -c "Add :NSMicrophoneUsageDescription string Arc Tracker uses the microphone only if you record a video as proof of a habit." "$PL"
          $PB -c "Delete :UISupportedInterfaceOrientations~ipad" "$PL" || true

      - name: Install signing certificate and profile
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROFILE_B64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          echo "::add-mask::$KCPASS"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          PUUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          PNAME=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Name raw -o - -)
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision"

      - name: Archive (signed, App Store distribution)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=98Y85F9LBT \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER=com.animemindset.arctracker \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION=1.0

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>98Y85F9LBT</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.animemindset.arctracker</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight (no review submission)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove key material
        if: always()
        run: |
          rm -rf "$HOME/.private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
